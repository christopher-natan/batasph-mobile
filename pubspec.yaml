name: batasph_mobile
description: "BATASPH mobile app skeleton."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.5.1
  dio: ^5.7.0
  flutter_markdown: ^0.7.7+1
  flutter_screenutil: ^5.9.3
  flutter_volume_controller: ^2.0.2
  get: ^4.6.6
  google_sign_in: ^7.2.0
  logger: ^2.7.0
  path_provider: ^2.1.5
  record: ^6.1.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.3
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/audio/
    - assets/icon/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 900
